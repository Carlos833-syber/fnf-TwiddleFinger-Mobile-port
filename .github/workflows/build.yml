name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Android
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install dependencies
        run: |
          haxelib run hmm install

      - name: Reinstall Lime
        run: |
          haxelib remove lime || true
          haxelib install lime
          haxelib set lime latest

      - name: Install OpenFL
        run: |
          haxelib remove openfl || true
          haxelib install openfl
          haxelib set openfl latest

      - name: Install hxcpp 4.3.45
        run: |
          wget -O /tmp/hxcpp.zip \
            https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib install /tmp/hxcpp.zip --quiet
          haxelib set hxcpp 4.3.45

      - name: Install Flixel
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Install hxvlc
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Setup Lime Android
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          haxelib run lime setup
          haxelib run lime setup android

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"

      - name: Clean
        run: |
          rm -rf export
          rm -rf build

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Show Manifest Error
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== ANDROID MANIFEST ====="

          find export \
            -name "AndroidManifest.xml" \
            -print 2>/dev/null || true

          MANIFEST="export/release/android/bin/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            echo "===== MANIFEST CONTENT ====="
            nl -ba "$MANIFEST"

            echo "===== XML VALIDATION ====="

            python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          filename = sys.argv[1]

          try:
              ET.parse(filename)
              print("XML VALIDO")
          except Exception as e:
              print("XML INVALIDO")
              print(e)
          PY
          else
            echo "Manifest não encontrado."
          fi

      - name: Show Android Project
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== ANDROID PROJECT ====="

          if [ -d "export/release/android/bin/app" ]; then
            find export/release/android/bin/app \
              -maxdepth 5 \
              -type f \
              -print | head -300
          fi

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload Diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-Diagnostics
          path: |
            export/release/android/**/*.xml
            export/release/android/**/*.txt
            export/release/android/**/*.log
          if-no-files-found: ignore

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "BUILD FALHOU"
          exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
