name: Build TwiddleFinger Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # HAXE
      # ==========================================
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.3.5'


      # ==========================================
      # ANDROID
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK and NDK
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"


      # ==========================================
      # DEPENDÊNCIAS LINUX
      # ==========================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libvlc-dev \
            libvlccore-dev \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev


      # ==========================================
      # HAXELIB
      # ==========================================
      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib


      # ==========================================
      # HMM
      # ==========================================
      - name: Install HMM
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install


      # ==========================================
      # LIME
      # ==========================================
      - name: Install Lime
        run: |
          haxelib remove lime || true
          haxelib install lime --quiet


      # ==========================================
      # OPENFL
      # ==========================================
      - name: Install OpenFL
        run: |
          haxelib remove openfl || true
          haxelib install openfl --quiet


      # ==========================================
      # HXCPP
      # ==========================================
      - name: Install hxcpp 4.3.45
        run: |
          curl -L \
            -o /tmp/hxcpp-4.3.45.zip \
            https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip

          haxelib remove hxcpp || true

          haxelib install /tmp/hxcpp-4.3.45.zip --quiet


      # ==========================================
      # FLIXEL
      # ==========================================
      - name: Install Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0 --quiet


      # ==========================================
      # HXVLС
      # ==========================================
      - name: Install hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4 --quiet


      # ==========================================
      # VER DEPENDÊNCIAS
      # ==========================================
      - name: Check Haxelib
        run: |
          echo "=============================="
          echo "HAXE"
          echo "=============================="

          haxe --version

          echo ""
          echo "=============================="
          echo "HAXELIB"
          echo "=============================="

          haxelib list


      # ==========================================
      # CONFIGURAR LIME
      # ==========================================
      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

          haxelib run lime config ANDROID_SDK \
            "$ANDROID_SDK_ROOT"

          haxelib run lime config ANDROID_NDK_ROOT \
            "$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          haxelib run lime config JAVA_HOME \
            "$JAVA_HOME"


      # ==========================================
      # VERIFICAR LIME
      # ==========================================
      - name: Check Lime
        run: |
          echo "=============================="
          echo "LIME PATH"
          echo "=============================="

          haxelib path lime

          echo ""
          echo "Lime instalado corretamente."


      # ==========================================
      # LIMPAR
      # ==========================================
      - name: Clean
        run: |
          rm -rf export
          rm -rf build


      # ==========================================
      # GERAR PROJETO ANDROID
      # ==========================================
      - name: Generate Android project
        run: |
          haxelib run lime build android -release -n


      # ==========================================
      # PROCURAR MANIFEST
      # ==========================================
      - name: Find AndroidManifest
        run: |
          echo "========================================"
          echo "ANDROID MANIFESTS"
          echo "========================================"

          find export \
            -name "AndroidManifest.xml" \
            -type f \
            -print


      # ==========================================
      # CORRIGIR MANIFEST
      # ==========================================
      - name: Fix AndroidManifest
        run: |

          echo "========================================"
          echo "CORRIGINDO ANDROID MANIFEST"
          echo "========================================"

          find export \
            -name "AndroidManifest.xml" \
            -type f \
            | while read file
          do

            echo ""
            echo "Arquivo:"
            echo "$file"

            # Remove condição inválida do Lime
            sed -i 's/ if="lime &ge; 8.2.0"//g' "$file"

            # Remove versão sem entidade XML
            sed -i 's/ if="lime >= 8.2.0"//g' "$file"

            # Outras possíveis variações
            sed -i 's/ if="lime &lt;= 8.2.0"//g' "$file"

            sed -i 's/ if="lime <= 8.2.0"//g' "$file"

            echo ""
            echo "Manifest corrigido:"
            cat "$file"

          done


      # ==========================================
      # VERIFICAR MANIFEST
      # ==========================================
      - name: Verify Manifest
        run: |

          echo "========================================"
          echo "VERIFICANDO MANIFEST"
          echo "========================================"

          FOUND=0

          while IFS= read -r file
          do

            FOUND=1

            echo ""
            echo "Verificando:"
            echo "$file"

            if grep -n 'lime &ge;' "$file"; then
              echo ""
              echo "ERRO: &ge; ainda está no Manifest."
              exit 1
            fi

            if grep -n 'lime >=' "$file"; then
              echo ""
              echo "ERRO: lime >= ainda está no Manifest."
              exit 1
            fi

          done < <(
            find export \
              -name "AndroidManifest.xml" \
              -type f
          )

          if [ "$FOUND" = "0" ]; then
            echo "Nenhum AndroidManifest encontrado."
            exit 1
          fi

          echo ""
          echo "Manifest verificado."


      # ==========================================
      # VALIDAR XML
      # ==========================================
      - name: Validate Manifest XML
        run: |

          python3 - <<'PY'

          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "export/release/android/**/AndroidManifest.xml",
              recursive=True
          )

          print("========================================")
          print("VALIDAÇÃO XML")
          print("========================================")

          if not files:
              print("Nenhum Manifest encontrado.")
              raise SystemExit(1)

          for file in files:

              print("")
              print("Validando:", file)

              try:

                  ET.parse(file)

                  print("XML OK")

              except Exception as error:

                  print("")
                  print("XML INVÁLIDO:")
                  print(error)

                  raise SystemExit(1)

          PY


      # ==========================================
      # MOSTRAR MANIFEST FINAL
      # ==========================================
      - name: Show Manifest
        run: |

          echo "========================================"
          echo "MANIFEST FINAL"
          echo "========================================"

          find export/release/android \
            -name "AndroidManifest.xml" \
            -type f \
            -print \
            -exec sh -c '
              echo "----------------------------------------"
              echo "$1"
              echo "----------------------------------------"
              nl -ba "$1"
            ' _ {} \;


      # ==========================================
      # COMPILAR APK
      # ==========================================
      - name: Build APK
        run: |

          echo "========================================"
          echo "COMPILANDO APK"
          echo "========================================"

          cd export/release/android

          chmod +x gradlew

          ./gradlew assembleDebug \
            --stacktrace \
            --info


      # ==========================================
      # PROCURAR APK
      # ==========================================
      - name: Find APK
        if: success()
        run: |

          echo "========================================"
          echo "APKS"
          echo "========================================"

          find export \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # PREPARAR APK
      # ==========================================
      - name: Prepare APK
        if: success()
        run: |

          mkdir -p dist

          APK=$(find export \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "Nenhum APK encontrado."

            exit 1

          fi

          echo "APK:"
          echo "$APK"

          cp "$APK" \
            dist/TwiddleFinger-Android.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: dist/TwiddleFinger-Android.apk
          if-no-files-found: error


      # ==========================================
      # DIAGNÓSTICO
      # ==========================================
      - name: Diagnostics
        if: always()
        run: |

          echo "========================================"
          echo "DIAGNÓSTICO"
          echo "========================================"

          echo ""
          echo "PROJECT.XML"
          echo "========================================"

          cat Project.xml || true

          echo ""
          echo "HMM.JSON"
          echo "========================================"

          cat hmm.json || true

          echo ""
          echo "MANIFESTS"
          echo "========================================"

          find export \
            -name "AndroidManifest.xml" \
            -type f \
            -print \
            || true

          echo ""
          echo "PROCURANDO PROBLEMAS"
          echo "========================================"

          grep -Rni \
            -E 'lime|&ge;|&le;|if=' \
            export/release/android \
            2>/dev/null \
            || true


      # ==========================================
      # UPLOAD DIAGNÓSTICO
      # ==========================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-Diagnostics
          path: |
            export/
            Project.xml
            hmm.json
          if-no-files-found: warn
