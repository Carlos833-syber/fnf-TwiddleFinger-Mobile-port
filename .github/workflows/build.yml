name: Build TwiddleFinger Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;25.2.9519653"

      - name: Android variables
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install HMM
        run: |
          haxelib install hmm
          haxelib run hmm install

      - name: Force Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          rm -rf .haxelib/flixel

          haxelib install flixel 5.8.0

          test -d ".haxelib/flixel/5,8,0"

      - name: Install HXVLС
        run: |
          haxelib install hxvlc 1.5.4

      - name: Install Lime
        run: |
          haxelib install lime 8.3.2

      - name: Install OpenFL
        run: |
          haxelib install openfl

      - name: Install HXCPP
        run: |
          rm -rf /tmp/hxcpp

          git clone --depth 1 \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          cd /tmp/hxcpp/tools/hxcpp

          haxe compile.hxml

          cd "$GITHUB_WORKSPACE"

          haxelib dev hxcpp /tmp/hxcpp

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Fix Flixel include.xml
        run: |
          FLIXEL=".haxelib/flixel/5,8,0/include.xml"

          if [ ! -f "$FLIXEL" ]; then
            echo "ERRO: Flixel include.xml não encontrado!"
            exit 1
          fi

          echo "Flixel:"
          haxelib path flixel

          echo ""
          echo "Corrigindo condições antigas do Flixel..."

          sed -i 's/if="lime &ge; 8\.2\.0"//g' "$FLIXEL"
          sed -i 's/if="lime >= 8\.2\.0"//g' "$FLIXEL"
          sed -i 's/if="lime &amp;ge; 8\.2\.0"//g' "$FLIXEL"

          echo "include.xml corrigido."

      - name: Setup Android Lime
        run: |
          haxelib run lime setup android

      - name: Clean
        run: |
          rm -rf export
          rm -rf .lime

      - name: Generate Android project
        run: |
          echo "======================================"
          echo "GERANDO PROJETO ANDROID"
          echo "======================================"

          haxelib run lime build android -release --no-output

      - name: Find AndroidManifest
        run: |
          echo "======================================"
          echo "PROCURANDO ANDROIDMANIFEST"
          echo "======================================"

          find export -name "AndroidManifest.xml" -print

      - name: Fix generated AndroidManifest
        run: |
          echo "======================================"
          echo "CORRIGINDO ANDROIDMANIFEST"
          echo "======================================"

          FOUND=0

          while IFS= read -r -d '' FILE
          do
            FOUND=1

            echo ""
            echo "Corrigindo:"
            echo "$FILE"

            # Corrige a entidade inválida &ge;
            sed -i 's/&ge;/>=/g' "$FILE"

            # Corrige a versão escapada
            sed -i 's/&amp;ge;/>=/g' "$FILE"

            # Remove condições Lime que não devem estar no Manifest
            sed -i 's/ if="lime >= 8\.2\.0"//g' "$FILE"
            sed -i 's/ if="lime &gt;= 8\.2\.0"//g' "$FILE"
            sed -i 's/ if="lime &ge; 8\.2\.0"//g' "$FILE"

          done < <(find export/release/android -name "AndroidManifest.xml" -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "Nenhum AndroidManifest encontrado!"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "VALIDANDO MANIFEST"
          echo "======================================"

          for FILE in $(find export/release/android -name "AndroidManifest.xml")
          do
            echo ""
            echo "Arquivo:"
            echo "$FILE"

            python3 -c "import xml.etree.ElementTree as ET; ET.parse('$FILE'); print('XML VALIDO')"
          done

      - name: Show AndroidManifest
        run: |
          echo "======================================"
          echo "ANDROIDMANIFEST FINAL"
          echo "======================================"

          find export/release/android \
            -name "AndroidManifest.xml" \
            -exec sh -c 'echo ""; echo "===== $1 ====="; nl -ba "$1"' _ {} \;

      - name: Build Android with Gradle
        run: |
          echo "======================================"
          echo "COMPILANDO APK COM GRADLE"
          echo "======================================"

          cd export/release/android

          chmod +x gradlew

          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "======================================"
          echo "APK GERADO"
          echo "======================================"

          find export -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
