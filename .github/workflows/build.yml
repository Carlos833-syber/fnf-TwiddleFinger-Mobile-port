name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Android
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install dependencies
        run: |
          haxelib run hmm install

      - name: Install Lime
        run: |
          haxelib remove lime || true
          haxelib install lime

      - name: Install OpenFL
        run: |
          haxelib remove openfl || true
          haxelib install openfl

      - name: Install hxcpp 4.3.45
        run: |
          wget -O /tmp/hxcpp.zip https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib install /tmp/hxcpp.zip --quiet
          haxelib set hxcpp 4.3.45

      - name: Install Flixel
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Install hxvlc
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup android

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"

      - name: Clean
        run: |
          rm -rf export
          rm -rf build

      - name: Build APK
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Find APK
        if: always()
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: export/**/*.apk
          if-no-files-found: error
