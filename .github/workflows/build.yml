name: Build TwiddleFinger Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # HAXE
      # ==========================================
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.3.5'


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"


      # ==========================================
      # DEPENDÊNCIAS DO LINUX
      # ==========================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libvlc-dev \
            libvlccore-dev \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev


      # ==========================================
      # HAXELIB
      # ==========================================
      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib


      # ==========================================
      # HMM
      # ==========================================
      - name: Install HMM
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install


      # ==========================================
      # CORRIGIR LIME
      # ==========================================
      #
      # O HMM pode instalar Lime a partir do Git.
      # Isso pode deixar o lime.ndll ausente.
      #
      # Por isso removemos o Lime instalado e
      # instalamos a versão publicada no Haxelib.
      #
      - name: Reinstall Lime
        run: |
          haxelib remove lime || true
          haxelib install lime --quiet


      # ==========================================
      # OPENFL
      # ==========================================
      - name: Install OpenFL
        run: |
          haxelib remove openfl || true
          haxelib install openfl --quiet


      # ==========================================
      # HXCPP 4.3.45
      # ==========================================
      #
      # O hxcpp 4.3.2 do Haxelib tem problemas com
      # NDKs mais novos.
      #
      # Instalamos 4.3.45 diretamente do release
      # oficial do HaxeFoundation.
      #
      - name: Install hxcpp 4.3.45
        run: |
          curl -L \
            -o /tmp/hxcpp-4.3.45.zip \
            https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip

          haxelib remove hxcpp || true

          haxelib install /tmp/hxcpp-4.3.45.zip --quiet


      # ==========================================
      # FLIXEL
      # ==========================================
      - name: Install Flixel
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0 --quiet


      # ==========================================
      # HXVLС
      # ==========================================
      - name: Install hxvlc
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4 --quiet


      # ==========================================
      # MOSTRAR VERSÕES
      # ==========================================
      - name: Show Haxelib versions
        run: |
          echo "=============================="
          echo "HAXE"
          echo "=============================="
          haxe --version

          echo ""
          echo "=============================="
          echo "HAXELIB"
          echo "=============================="
          haxelib list

          echo ""
          echo "=============================="
          echo "ANDROID"
          echo "=============================="
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"


      # ==========================================
      # CONFIGURAR LIME
      # ==========================================
      - name: Setup Lime Android
        run: |
          mkdir -p ~/.android

          haxelib run lime setup android

          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"

          haxelib run lime config ANDROID_NDK_ROOT \
            "$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          haxelib run lime config JAVA_HOME "$JAVA_HOME"


      # ==========================================
      # VERIFICAR LIME
      # ==========================================
      - name: Check Lime
        run: |
          echo "=============================="
          echo "LIME PATH"
          echo "=============================="

          haxelib path lime

          echo ""
          echo "=============================="
          echo "LIME VERSION"
          echo "=============================="

          haxelib run lime version


      # ==========================================
      # LIMPAR BUILD ANTIGO
      # ==========================================
      - name: Clean build
        run: |
          rm -rf export
          rm -rf build


      # ==========================================
      # PREPARAR PROJETO ANDROID
      # ==========================================
      #
      # Primeiro geramos o projeto Android sem
      # deixar o Gradle começar imediatamente.
      #
      - name: Prepare Android project
        run: |
          haxelib run lime build android -release -n


      # ==========================================
      # CORRIGIR ANDROIDMANIFEST
      # ==========================================
      #
      # Remove o atributo inválido:
      #
      # if="lime &ge; 8.2.0"
      #
      # Esse atributo não pode permanecer no
      # AndroidManifest.xml final.
      #
      - name: Fix AndroidManifest
        run: |
          echo "========================================"
          echo "PROCURANDO MANIFESTS"
          echo "========================================"

          find export -name "AndroidManifest.xml" -type f -print || true

          echo ""
          echo "========================================"
          echo "CORRIGINDO MANIFESTS"
          echo "========================================"

          find export -name "AndroidManifest.xml" -type f | while read file
          do
            echo ""
            echo "Arquivo:"
            echo "$file"

            sed -i 's/ if="lime &ge; 8.2.0"//g' "$file"
            sed -i 's/ if="lime >= 8.2.0"//g' "$file"
            sed -i 's/ if="lime &lt;= 8.2.0"//g' "$file"
            sed -i 's/ if="lime <= 8.2.0"//g' "$file"

            echo ""
            echo "Manifest depois da correção:"
            cat "$file"
          done


      # ==========================================
      # VERIFICAR SE A STRING AINDA EXISTE
      # ==========================================
      - name: Verify AndroidManifest
        run: |
          echo "========================================"
          echo "VERIFICAÇÃO DO MANIFEST"
          echo "========================================"

          if grep -R 'lime &ge;' export/release/android 2>/dev/null; then
            echo "ERRO: ainda existe &ge; no Manifest!"
            exit 1
          fi

          if grep -R 'lime >=' export/release/android 2>/dev/null; then
            echo "ERRO: ainda existe lime >= no Manifest!"
            exit 1
          fi

          echo "Manifest não contém as condições inválidas."


      # ==========================================
      # VALIDAR XML
      # ==========================================
      - name: Validate AndroidManifest XML
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "export/release/android/**/AndroidManifest.xml",
              recursive=True
          )

          print("Manifests encontrados:", files)

          if not files:
              print("Nenhum AndroidManifest encontrado.")
              raise SystemExit(1)

          for file in files:
              print("")
              print("Validando:", file)

              try:
                  ET.parse(file)
                  print("XML OK")
              except Exception as e:
                  print("XML INVÁLIDO")
                  print(e)
                  raise SystemExit(1)
          PY


      # ==========================================
      # MOSTRAR MANIFEST FINAL
      # ==========================================
      - name: Show final AndroidManifest
        run: |
          echo "========================================"
          echo "MANIFEST FINAL"
          echo "========================================"

          find export/release/android \
            -name "AndroidManifest.xml" \
            -type f \
            -print \
            -exec sh -c 'echo "-----"; nl -ba "$1"' _ {} \;


      # ==========================================
      # COMPILAR COM GRADLE
      # ==========================================
      - name: Build APK with Gradle
        run: |
          cd export/release/android

          chmod +x gradlew

          ./gradlew assembleDebug \
            --stacktrace \
            --info


      # ==========================================
      # PROCURAR APK
      # ==========================================
      - name: Find APK
        if: success()
        run: |
          echo "========================================"
          echo "APKs ENCONTRADOS"
          echo "========================================"

          find export \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # COPIAR APK
      # ==========================================
      - name: Prepare APK
        if: success()
        run: |
          mkdir -p dist

          APK=$(find export \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Nenhum APK encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" dist/TwiddleFinger-Android.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: dist/TwiddleFinger-Android.apk
          if-no-files-found: error


      # ==========================================
      # DIAGNÓSTICOS SE FALHAR
      # ==========================================
      - name: Diagnostics
        if: always()
        run: |
          echo "========================================"
          echo "DIAGNÓSTICOS"
          echo "========================================"

          echo ""
          echo "PROJECT.XML:"
          cat Project.xml || true

          echo ""
          echo "HMM.JSON:"
          cat hmm.json || true

          echo ""
          echo "ANDROID MANIFESTS:"
          find export \
            -name "AndroidManifest.xml" \
            -type f \
            -print || true

          echo ""
          echo "ERROS DE MANIFEST:"
          grep -Rni \
            -E 'lime|&ge;|&le;|if=' \
            export/release/android 2>/dev/null \
            || true


      # ==========================================
      # UPLOAD DIAGNÓSTICOS
      # ==========================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-Diagnostics
          path: |
            export/
            Project.xml
            hmm.json
          if-no-files-found: warn
