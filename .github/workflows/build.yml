name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Android Environment
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Project Dependencies
        run: |
          haxelib run hmm install

      - name: Reinstall Lime
        run: |
          haxelib remove lime || true
          haxelib install lime

          echo "===== LIME PATH ====="
          haxelib path lime

      - name: Reinstall OpenFL
        run: |
          haxelib remove openfl || true
          haxelib install openfl

          echo "===== OPENFL PATH ====="
          haxelib path openfl

      - name: Install hxcpp 4.3.45
        run: |
          wget -O /tmp/hxcpp-4.3.45.zip \
            https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip

          haxelib install /tmp/hxcpp-4.3.45.zip --quiet
          haxelib set hxcpp 4.3.45

          echo "===== HXCPP ====="
          haxelib path hxcpp

      - name: Install Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Install hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Verify Environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== HAXE ====="
          haxe --version

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_SDK_ROOT"

          echo "===== ANDROID NDK ====="
          echo "$ANDROID_NDK_HOME"

          echo "===== HXCPP ====="
          haxelib path hxcpp

          echo "===== LIME ====="
          haxelib path lime

      - name: Setup Lime
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          haxelib run lime setup
          haxelib run lime setup android

      - name: Configure Lime Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"

      - name: Clean
        run: |
          rm -rf export
          rm -rf build

      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          echo "========================================"
          echo "BUILDING TWIDDLEFINGER"
          echo "========================================"

          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Diagnose Manifest
        if: always()
        run: |
          echo "========================================"
          echo "ANDROID MANIFEST SEARCH"
          echo "========================================"

          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "MAIN MANIFEST"
          echo "========================================"

          MANIFEST="export/release/android/bin/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            echo "MANIFEST FOUND:"
            echo "$MANIFEST"

            echo ""
            echo "========================================"
            echo "MANIFEST CONTENT"
            echo "========================================"

            nl -ba "$MANIFEST"

            echo ""
            echo "========================================"
            echo "XML VALIDATION"
            echo "========================================"

            python3 -c 'import sys,xml.etree.ElementTree as ET; f=sys.argv[1]; ET.parse(f); print("XML VALID")' "$MANIFEST" 2>&1 || true

            echo ""
            echo "========================================"
            echo "SUSPICIOUS CONTENT"
            echo "========================================"

            grep -n "lime" "$MANIFEST" || true
            grep -n "if=" "$MANIFEST" || true
            grep -n "&ge;" "$MANIFEST" || true
            grep -n "&le;" "$MANIFEST" || true

          else

            echo "MAIN MANIFEST NOT FOUND"

          fi

      - name: Diagnose All Android Manifests
        if: always()
        run: |
          echo "========================================"
          echo "ALL MANIFEST FILES"
          echo "========================================"

          find export/release/android \
            -type f \
            -name "AndroidManifest.xml" \
            -print 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT FILES"
          echo "========================================"

          if [ -d "export/release/android" ]; then
            find export/release/android \
              -maxdepth 7 \
              -type f \
              -print 2>/dev/null | head -500
          fi

      - name: Diagnose Gradle
        if: always()
        run: |
          echo "========================================"
          echo "GRADLE MANIFEST REPORTS"
          echo "========================================"

          find export/release/android \
            -type f \
            \( \
              -name "*manifest*report*" \
              -o \
              -name "manifest-merger-*.txt" \
              -o \
              -name "manifest-merger-*.xml" \
              -o \
              -name "*.log" \
            \) \
            -print 2>/dev/null || true

      - name: Find APK
        if: always()
        run: |
          echo "========================================"
          echo "APK SEARCH"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      - name: Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-Diagnostics
          path: |
            export/release/android/**/*.xml
            export/release/android/**/*.txt
            export/release/android/**/*.log
          if-no-files-found: ignore

      - name: Stop If Build Failed
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========================================"
          echo "BUILD FAILED"
          echo "========================================"
          exit 1

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
