name: Build TwiddleFinger Android

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:

      # ==============================
      # CHECKOUT
      # ==============================

      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # JAVA
      # ==============================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==============================
      # HAXE
      # ==============================

      - name: Setup Haxe 4.3.5
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'


      # ==============================
      # ANDROID SDK
      # ==============================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==============================
      # ANDROID NDK
      # ==============================

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"


      # ==============================
      # ANDROID ENVIRONMENT
      # ==============================

      - name: Configure Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"


      # ==============================
      # HAXELIB
      # ==============================

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib


      # ==============================
      # HMM
      # ==============================

      - name: Install HMM
        run: |
          haxelib install hmm --quiet


      # ==============================
      # HMM DEPENDENCIES
      # ==============================

      - name: Install project dependencies
        run: |
          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi


      # ==============================
      # FLIXEL 5.8.0
      # ==============================

      - name: Install Flixel 5.8.0
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALANDO FLIXEL 5.8.0"
          echo "======================================"

          # Remove qualquer versão anterior
          rm -rf .haxelib/flixel

          # Instala exatamente a versão do projeto
          haxelib install flixel 5.8.0 --quiet

          echo ""
          echo "Conteúdo de .haxelib/flixel:"
          ls -la .haxelib/flixel

          echo ""
          echo "Versão ativa:"
          haxelib path flixel

          # Confirma que a pasta correta existe
          if [ ! -d ".haxelib/flixel/5,8,0" ]; then
            echo ""
            echo "ERRO: Flixel 5.8.0 não foi instalado corretamente."
            exit 1
          fi

          echo ""
          echo "OK: Flixel 5.8.0 instalado."


      # ==============================
      # HXVLC
      # ==============================

      - name: Install hxvlc 1.5.4
        run: |
          haxelib install hxvlc 1.5.4 --quiet

          echo ""
          echo "HXVLC:"
          haxelib path hxvlc


      # ==============================
      # LIME
      # ==============================

      - name: Install Lime 8.3.2
        run: |
          haxelib remove lime || true
          haxelib install lime 8.3.2 --quiet

          echo ""
          echo "LIME:"
          haxelib path lime


      # ==============================
      # OPENFL
      # ==============================

      - name: Install OpenFL
        run: |
          haxelib install openfl --quiet

          echo ""
          echo "OPENFL:"
          haxelib path openfl


      # ==============================
      # HXCPP
      # ==============================

      - name: Install hxcpp 4.3.45
        shell: bash
        run: |
          set -e

          rm -rf /tmp/hxcpp

          git clone \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          cd /tmp/hxcpp

          git fetch --tags

          git checkout 4.3.45

          cd "$GITHUB_WORKSPACE"

          haxelib dev hxcpp /tmp/hxcpp

          echo ""
          echo "HXCPP:"
          haxelib path hxcpp


      # ==============================
      # LIME SETUP
      # ==============================

      - name: Setup Lime
        run: |
          haxelib run lime setup


      # ==============================
      # CORRIGIR FLIXEL
      # ==============================

      - name: Fix Flixel Android Manifest
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CORRIGINDO FLIXEL"
          echo "======================================"

          FLIXEL_PATH="$GITHUB_WORKSPACE/.haxelib/flixel/5,8,0"

          echo "Flixel:"
          echo "$FLIXEL_PATH"

          if [ ! -f "$FLIXEL_PATH/include.xml" ]; then
            echo ""
            echo "ERRO: include.xml não encontrado."
            exit 1
          fi

          echo ""
          echo "Antes da correção:"

          grep -n -C 3 \
            "&ge;\|lime >=\|allowBackup\|appCategory" \
            "$FLIXEL_PATH/include.xml" || true

          # Remove a condição problemática do AndroidManifest
          sed -i 's/ if="lime &ge; 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          sed -i 's/ if="lime >= 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          echo ""
          echo "Depois da correção:"

          grep -n -C 3 \
            "&ge;\|lime >=\|allowBackup\|appCategory" \
            "$FLIXEL_PATH/include.xml" || true

          echo ""
          echo "Flixel corrigido."


      # ==============================
      # LIME ANDROID
      # ==============================

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android


      # ==============================
      # VERIFICAR FLIXEL
      # ==============================

      - name: Verify Flixel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFICANDO FLIXEL"
          echo "======================================"

          echo ""
          echo "Haxelib:"
          haxelib path flixel

          echo ""
          echo "Diretório local:"

          ls -la .haxelib/flixel

          echo ""
          echo "Verificando Flixel 5.8.0..."

          if [ -d ".haxelib/flixel/5,8,0" ]; then
            echo "OK: Flixel 5.8.0 está instalado."
          else
            echo "ERRO: Flixel 5.8.0 não está instalado."
            exit 1
          fi


      # ==============================
      # VERSÕES
      # ==============================

      - name: Show versions
        run: |
          echo "======================================"
          echo "VERSÕES"
          echo "======================================"

          echo ""
          echo "Haxe:"
          haxe --version

          echo ""
          echo "Flixel:"
          haxelib path flixel

          echo ""
          echo "Lime:"
          haxelib path lime

          echo ""
          echo "hxvlc:"
          haxelib path hxvlc

          echo ""
          echo "hxcpp:"
          haxelib path hxcpp


      # ==============================
      # CLEAN
      # ==============================

      - name: Clean Android export
        run: |
          rm -rf export/release/android
          rm -rf export/debug/android


      # ==============================
      # BUILD
      # ==============================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "COMPILANDO APK"
          echo "======================================"

          haxelib run lime build android -release


      # ==============================
      # PROCURAR APK
      # ==============================

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "APKs ENCONTRADOS"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print


      # ==============================
      # UPLOAD
      # ==============================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
          compression-level: 0
