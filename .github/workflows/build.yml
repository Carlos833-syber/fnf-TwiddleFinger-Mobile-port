name: Build TwiddleFinger Android

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Haxelib dependencies
        run: |
          haxelib setup ~/haxelib

          haxelib install hmm --quiet

          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi

      - name: Install exact Flixel 5.8.0
        run: |
          haxelib install flixel 5.8.0 --quiet

          echo "=== Flixel path ==="
          haxelib path flixel

      - name: Install Lime 8.3.2
        run: |
          haxelib remove lime || true
          haxelib install lime 8.3.2 --quiet

      - name: Install OpenFL
        run: |
          haxelib install openfl --quiet

      - name: Install hxcpp
        run: |
          rm -rf .haxelib/hxcpp

          git clone --depth 1 \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          cd /tmp/hxcpp

          git fetch --tags --depth 1 || true

          git checkout 4.3.45 2>/dev/null || true

          cd "$GITHUB_WORKSPACE"

          haxelib dev hxcpp /tmp/hxcpp

          echo "=== hxcpp ==="
          haxelib path hxcpp

      - name: Install Lime native files
        run: |
          haxelib run lime setup

      - name: Fix Flixel Android Manifest condition
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Procurando include.xml do Flixel"
          echo "======================================"

          FLIXEL_PATH="$(haxelib path flixel | grep -E '/flixel/5,8,0($|/)' | head -n 1 || true)"

          if [ -z "$FLIXEL_PATH" ]; then
            FLIXEL_PATH="$(haxelib path flixel | head -n 1)"
          fi

          echo "Flixel encontrado em:"
          echo "$FLIXEL_PATH"

          if [ ! -f "$FLIXEL_PATH/include.xml" ]; then
            echo "ERRO: include.xml do Flixel não encontrado."

            echo "Arquivos encontrados:"
            find "$FLIXEL_PATH" -maxdepth 2 -type f | head -100

            exit 1
          fi

          echo ""
          echo "=== Antes da correção ==="
          grep -n -C 3 "&ge;\|android:allowBackup\|appCategory" \
            "$FLIXEL_PATH/include.xml" || true

          # O Flixel antigo usa uma condição XML que acaba
          # gerando:
          #
          # if="lime &ge; 8.2.0"
          #
          # no AndroidManifest.xml.
          #
          # Removemos somente essa condição problemática.
          sed -i 's/ if="lime &ge; 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          sed -i 's/ if="lime >= 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          echo ""
          echo "=== Depois da correção ==="
          grep -n -C 3 "&ge;\|android:allowBackup\|appCategory" \
            "$FLIXEL_PATH/include.xml" || true

          echo ""
          echo "Correção do Flixel concluída."

      - name: Configure Lime Android
        run: |
          haxelib run lime setup android

      - name: Verify Haxe libraries
        run: |
          echo "========== HAXE =========="
          haxe --version

          echo "========== HAXELIBS =========="
          haxelib list

          echo "========== LIME =========="
          haxelib path lime

          echo "========== FLIXEL =========="
          haxelib path flixel

          echo "========== HXCPP =========="
          haxelib path hxcpp

      - name: Clean old Android export
        run: |
          rm -rf export/release/android
          rm -rf export/debug/android

      - name: Build Android APK
        run: |
          haxelib run lime build android -release

      - name: Find APK
        run: |
          echo "========== APKs encontrados =========="

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
          compression-level: 0
