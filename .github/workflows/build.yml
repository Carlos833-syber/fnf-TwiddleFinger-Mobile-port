name: Build TwiddleFinger Android

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # HAXE
      # ==========================================

      - name: Setup Haxe 4.3.5
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # ANDROID NDK
      # ==========================================

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"


      # ==========================================
      # ANDROID VARIABLES
      # ==========================================

      - name: Configure Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"


      # ==========================================
      # HAXELIB
      # ==========================================

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib


      # ==========================================
      # HMM
      # ==========================================

      - name: Install HMM
        run: |
          haxelib install hmm --quiet


      # ==========================================
      # PROJECT DEPENDENCIES
      # ==========================================

      - name: Install project dependencies
        run: |
          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi


      # ==========================================
      # FLIXEL 5.8.0
      # ==========================================

      - name: Install Flixel 5.8.0
        shell: bash
        run: |
          set -e

          rm -rf .haxelib/flixel

          haxelib install flixel 5.8.0 --quiet

          echo "======================================"
          echo "FLIXEL"
          echo "======================================"

          ls -la .haxelib/flixel

          if [ ! -d ".haxelib/flixel/5,8,0" ]; then
            echo "ERRO: Flixel 5.8.0 não encontrado."
            exit 1
          fi

          echo "Flixel 5.8.0 OK."


      # ==========================================
      # HXVLC
      # ==========================================

      - name: Install hxvlc 1.5.4
        run: |
          haxelib install hxvlc 1.5.4 --quiet


      # ==========================================
      # LIME
      # ==========================================

      - name: Install Lime 8.3.2
        run: |
          haxelib remove lime || true
          haxelib install lime 8.3.2 --quiet


      # ==========================================
      # OPENFL
      # ==========================================

      - name: Install OpenFL
        run: |
          haxelib install openfl --quiet


      # ==========================================
      # HXCPP
      # ==========================================

      - name: Install and build hxcpp
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BAIXANDO HXCPP"
          echo "======================================"

          rm -rf /tmp/hxcpp

          git clone --depth 1 \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          cd /tmp/hxcpp

          echo ""
          echo "======================================"
          echo "COMPILANDO HXCPP TOOLS"
          echo "======================================"

          cd tools/hxcpp

          haxe compile.hxml

          cd /tmp/hxcpp

          echo ""
          echo "======================================"
          echo "INSTALANDO HXCPP"
          echo "======================================"

          cd "$GITHUB_WORKSPACE"

          haxelib dev hxcpp /tmp/hxcpp

          echo ""
          echo "HXCPP:"
          haxelib path hxcpp


      # ==========================================
      # LIME SETUP
      # ==========================================

      - name: Setup Lime
        run: |
          haxelib run lime setup


      # ==========================================
      # CORRIGIR FLIXEL
      # ==========================================

      - name: Fix Flixel Android Manifest
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CORRIGINDO FLIXEL ANDROID"
          echo "======================================"

          FLIXEL_PATH="$GITHUB_WORKSPACE/.haxelib/flixel/5,8,0"

          if [ ! -f "$FLIXEL_PATH/include.xml" ]; then
            echo "ERRO: include.xml não encontrado."
            exit 1
          fi

          echo "Flixel:"
          echo "$FLIXEL_PATH"

          echo ""
          echo "Antes:"

          grep -n -C 3 \
            "&ge;\|lime >=\|allowBackup\|appCategory" \
            "$FLIXEL_PATH/include.xml" || true

          sed -i 's/ if="lime &ge; 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          sed -i 's/ if="lime >= 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          echo ""
          echo "Depois:"

          grep -n -C 3 \
            "&ge;\|lime >=\|allowBackup\|appCategory" \
            "$FLIXEL_PATH/include.xml" || true

          echo ""
          echo "Flixel corrigido."


      # ==========================================
      # LIME ANDROID
      # ==========================================

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android


      # ==========================================
      # VERIFICAÇÕES
      # ==========================================

      - name: Verify dependencies
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "HAXE"
          echo "======================================"

          haxe --version


          echo ""
          echo "======================================"
          echo "FLIXEL"
          echo "======================================"

          haxelib path flixel

          if [ ! -d ".haxelib/flixel/5,8,0" ]; then
            echo "ERRO: Flixel 5.8.0 não está instalado."
            exit 1
          fi


          echo ""
          echo "======================================"
          echo "HXVLC"
          echo "======================================"

          haxelib path hxvlc


          echo ""
          echo "======================================"
          echo "LIME"
          echo "======================================"

          haxelib path lime


          echo ""
          echo "======================================"
          echo "HXCPP"
          echo "======================================"

          haxelib path hxcpp

          if [ ! -f "/tmp/hxcpp/bin/hxcpp.n" ] && \
             [ ! -f "/tmp/hxcpp/tools/hxcpp/hxcpp.n" ]; then

            echo ""
            echo "AVISO: hxcpp.n não foi encontrado nos caminhos esperados."
            echo "Conteúdo do hxcpp:"
            find /tmp/hxcpp -name "hxcpp.n" -print
          fi


      # ==========================================
      # LIMPAR BUILD
      # ==========================================

      - name: Clean Android
        run: |
          rm -rf export/release/android
          rm -rf export/debug/android


      # ==========================================
      # BUILD
      # ==========================================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "COMPILANDO TWIDDLEFINGER"
          echo "======================================"

          haxelib run lime build android -release


      # ==========================================
      # PROCURAR APK
      # ==========================================

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "APKs ENCONTRADOS"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
          compression-level: 0
