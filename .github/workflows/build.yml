name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build TwiddleFinger APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

          echo "CPPFLAGS=-DANDROID" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          echo "LDFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Lime
        run: |
          haxelib install lime
          haxelib set lime latest

      - name: Install OpenFL
        run: |
          haxelib install openfl
          haxelib set openfl latest

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install dependencies
        run: |
          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi

      - name: Install Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Install hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup android

      - name: Check NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          cat "$ANDROID_NDK_HOME/source.properties"

          echo "===== CLANG ====="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

          echo "===== TYPEINFO ====="
          find "$ANDROID_NDK_HOME" -name typeinfo -print | head -20

      - name: Clean
        run: |
          rm -rf export
          rm -rf build

      - name: Build Android
        env:
          HXCPP_NO_PCH: "1"
        run: |
          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Find APK
        if: always()
        run: |
          echo "===== APK ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
