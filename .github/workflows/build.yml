name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Lime
        run: |
          haxelib install lime

      - name: Install OpenFL
        run: |
          haxelib install openfl

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install project dependencies
        run: |
          haxelib run hmm install

      - name: Install Flixel
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Install hxvlc
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Install hxcpp
        run: |
          haxelib remove hxcpp || true
          haxelib install hxcpp

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild cpp

      - name: Check libraries
        run: |
          echo "Haxe:"
          haxe --version

          echo "Haxelib:"
          haxelib list

          echo "Lime:"
          haxelib path lime

          echo "HXCPP:"
          haxelib path hxcpp

      - name: Clean
        run: |
          rm -rf export
          rm -rf build

      - name: Build Android
        run: |
          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Find APK
        if: always()
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
