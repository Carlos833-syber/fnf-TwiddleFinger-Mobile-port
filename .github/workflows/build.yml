name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Lime
        run: |
          haxelib install lime
          haxelib set lime latest

      - name: Install OpenFL
        run: |
          haxelib install openfl
          haxelib set openfl latest

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install project dependencies
        run: |
          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi

      - name: Install Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Install hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Verify Haxe and Haxelib
        run: |
          echo "========== HAXE =========="
          haxe --version

          echo "========== HAXELIB =========="
          haxelib list

          echo "========== LIME =========="
          haxelib path lime

          echo "========== OPENFL =========="
          haxelib path openfl

          echo "========== HXCPP =========="
          haxelib path hxcpp

          echo "========== FLIXEL =========="
          haxelib path flixel

          echo "========== HXVLC =========="
          haxelib path hxvlc

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

          if [ -n "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          fi

      - name: Debug C++ Android
        run: |
          echo "========== ANDROID ENVIRONMENT =========="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          echo "========== NDK VERSION =========="
          if [ -n "$ANDROID_NDK_HOME" ]; then
            cat "$ANDROID_NDK_HOME/source.properties" || true
          fi

          echo "========== CLANG VERSION =========="
          if [ -f "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version
          else
            echo "clang++ não encontrado no caminho esperado"
          fi

          echo "========== TYPEINFO HEADERS =========="
          find "$ANDROID_NDK_HOME" -name "typeinfo" -print | head -20 || true

          echo "========== C++ INCLUDE DIRECTORIES =========="
          find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" \
            -type d -name "include" -print | head -30 || true

          echo "========== HXCPP =========="
          haxelib path hxcpp

      - name: Check Android tools
        run: |
          echo "========== ADB =========="
          adb version || true

          echo "========== SDKMANAGER =========="
          sdkmanager --version || true

          echo "========== NDK DIRECTORY =========="
          ls -la "$ANDROID_NDK_HOME" || true

      - name: Clean build
        run: |
          rm -rf export
          rm -rf build

      - name: Build Android APK
        run: |
          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Find APK
        if: always()
        run: |
          echo "========== APK FILES =========="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
