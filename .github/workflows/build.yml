name: Build TwiddleFinger Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # HAXE
      # ==========================================
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.3.5'


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android
        uses: android-actions/setup-android@v3


      - name: Install Android SDK and NDK
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653"

          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"


      # ==========================================
      # DEPENDÊNCIAS LINUX
      # ==========================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libvlc-dev \
            libvlccore-dev \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev


      # ==========================================
      # HAXELIB
      # ==========================================
      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib


      # ==========================================
      # HMM
      # ==========================================
      - name: Install HMM dependencies
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install


      # ==========================================
      # LIME
      # ==========================================
      - name: Install Lime
        run: |
          haxelib remove lime || true
          haxelib install lime 8.3.2 --quiet


      # ==========================================
      # OPENFL
      # ==========================================
      - name: Install OpenFL
        run: |
          haxelib remove openfl || true
          haxelib install openfl --quiet


      # ==========================================
      # HXCPP
      # ==========================================
      - name: Install hxcpp 4.3.45
        run: |
          curl -L \
            -o /tmp/hxcpp-4.3.45.zip \
            https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip

          haxelib remove hxcpp || true

          haxelib install /tmp/hxcpp-4.3.45.zip --quiet


      # ==========================================
      # FLIXEL 5.9.0
      # ==========================================
      #
      # Importante:
      # Flixel 5.9.0 contém a correção relacionada
      # ao AndroidManifest com Lime 8.2+.
      #
      - name: Install Flixel 5.9.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.9.0 --quiet


      # ==========================================
      # HXVLС
      # ==========================================
      - name: Install hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4 --quiet


      # ==========================================
      # VER DEPENDÊNCIAS
      # ==========================================
      - name: Check Haxelib
        run: |
          echo "========================================"
          echo "HAXE"
          echo "========================================"

          haxe --version

          echo ""
          echo "========================================"
          echo "HAXELIB"
          echo "========================================"

          haxelib list


      # ==========================================
      # CONFIGURAR LIME ANDROID
      # ==========================================
      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

          haxelib run lime config ANDROID_SDK \
            "$ANDROID_SDK_ROOT"

          haxelib run lime config ANDROID_NDK_ROOT \
            "$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          haxelib run lime config JAVA_HOME \
            "$JAVA_HOME"


      # ==========================================
      # VERIFICAR LIME
      # ==========================================
      - name: Check Lime
        run: |
          echo "========================================"
          echo "LIME"
          echo "========================================"

          haxelib path lime

          echo ""
          echo "Lime encontrado corretamente."


      # ==========================================
      # LIMPAR BUILD
      # ==========================================
      - name: Clean
        run: |
          rm -rf export
          rm -rf build


      # ==========================================
      # GERAR PROJETO ANDROID
      # ==========================================
      - name: Generate Android project
        run: |
          haxelib run lime build android -release -n


      # ==========================================
      # LOCALIZAR MANIFEST
      # ==========================================
      - name: Find AndroidManifest
        run: |
          echo "========================================"
          echo "ANDROID MANIFESTS"
          echo "========================================"

          find export \
            -name "AndroidManifest.xml" \
            -type f \
            -print


      # ==========================================
      # CORREÇÃO EXTRA DO MANIFEST
      # ==========================================
      #
      # Esta etapa é apenas uma proteção.
      # O Flixel 5.9.0 já deve evitar o problema.
      #
      - name: Fix AndroidManifest
        run: |
          echo "========================================"
          echo "CORRIGINDO MANIFEST"
          echo "========================================"

          find export \
            -name "AndroidManifest.xml" \
            -type f \
            | while read file
          do
            echo ""
            echo "Arquivo:"
            echo "$file"

            sed -i 's/ if="lime &ge; 8.2.0"//g' "$file"
            sed -i 's/ if="lime >= 8.2.0"//g' "$file"

            sed -i 's/ if="lime &lt;= 8.2.0"//g' "$file"
            sed -i 's/ if="lime <= 8.2.0"//g' "$file"

          done


      # ==========================================
      # MOSTRAR MANIFEST
      # ==========================================
      - name: Show AndroidManifest
        run: |
          echo "========================================"
          echo "MANIFEST FINAL"
          echo "========================================"

          find export \
            -name "AndroidManifest.xml" \
            -type f \
            -exec sh -c '
              echo ""
              echo "========================================"
              echo "$1"
              echo "========================================"
              nl -ba "$1"
            ' _ {} \;


      # ==========================================
      # VALIDAR XML
      # ==========================================
      - name: Validate AndroidManifest XML
        run: |
          python3 - <<'PY'

          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "export/release/android/**/AndroidManifest.xml",
              recursive=True
          )

          print("========================================")
          print("VALIDANDO XML")
          print("========================================")

          if not files:
              print("Nenhum AndroidManifest encontrado.")
              raise SystemExit(1)

          for file in files:

              print("")
              print("Arquivo:", file)

              try:
                  ET.parse(file)
                  print("XML OK")

              except Exception as error:

                  print("XML INVÁLIDO:")
                  print(error)

                  raise SystemExit(1)

          PY


      # ==========================================
      # VERIFICAR CONDIÇÃO PROBLEMÁTICA
      # ==========================================
      - name: Check Manifest Conditions
        run: |
          echo "========================================"
          echo "VERIFICANDO CONDIÇÕES"
          echo "========================================"

          if grep -Rni 'lime &ge;' \
            export/release/android \
            2>/dev/null
          then
            echo ""
            echo "ERRO: lime &ge; ainda está presente."
            exit 1
          fi

          if grep -Rni 'lime >=' \
            export/release/android \
            2>/dev/null
          then
            echo ""
            echo "ERRO: lime >= ainda está presente."
            exit 1
          fi

          echo "Nenhuma condição inválida encontrada."


      # ==========================================
      # GRADLE
      # ==========================================
      - name: Build APK
        run: |
          echo "========================================"
          echo "COMPILANDO APK"
          echo "========================================"

          cd export/release/android

          chmod +x gradlew

          ./gradlew assembleDebug \
            --stacktrace \
            --info


      # ==========================================
      # PROCURAR APK
      # ==========================================
      - name: Find APK
        if: success()
        run: |
          echo "========================================"
          echo "APKS"
          echo "========================================"

          find export \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # PREPARAR APK
      # ==========================================
      - name: Prepare APK
        if: success()
        run: |
          mkdir -p dist

          APK=$(find export \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Nenhum APK encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" \
            dist/TwiddleFinger-Android.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: dist/TwiddleFinger-Android.apk
          if-no-files-found: error


      # ==========================================
      # DIAGNÓSTICO
      # ==========================================
      - name: Diagnostics
        if: always()
        run: |
          echo "========================================"
          echo "DIAGNÓSTICO"
          echo "========================================"

          echo ""
          echo "PROJECT.XML"
          echo "========================================"

          cat Project.xml || true

          echo ""
          echo "HMM.JSON"
          echo "========================================"

          cat hmm.json || true

          echo ""
          echo "ANDROID MANIFESTS"
          echo "========================================"

          find export \
            -name "AndroidManifest.xml" \
            -type f \
            -print \
            || true

          echo ""
          echo "PROCURANDO IF / LIME"
          echo "========================================"

          grep -Rni \
            -E 'lime|&ge;|&le;|if=' \
            export/release/android \
            2>/dev/null \
            || true


      # ==========================================
      # UPLOAD DIAGNÓSTICOS
      # ==========================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-Diagnostics
          path: |
            export/
            Project.xml
            hmm.json
          if-no-files-found: warn
