name: Build TwiddleFinger Android

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # HAXE 4.3.5
      # ==========================================

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # ANDROID NDK
      # ==========================================

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"


      # ==========================================
      # ANDROID VARIABLES
      # ==========================================

      - name: Configure Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"


      # ==========================================
      # HAXELIB
      # ==========================================

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib


      # ==========================================
      # HMM
      # ==========================================

      - name: Install HMM
        run: |
          haxelib install hmm --quiet


      # ==========================================
      # HMM DEPENDENCIES
      # ==========================================

      - name: Install project dependencies
        run: |
          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi


      # ==========================================
      # FLIXEL 5.8.0
      # ==========================================

      - name: Install Flixel 5.8.0
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALANDO FLIXEL 5.8.0"
          echo "======================================"

          rm -rf .haxelib/flixel

          haxelib install flixel 5.8.0 --quiet

          echo ""
          echo "Conteúdo do Flixel:"

          ls -la .haxelib/flixel

          if [ ! -d ".haxelib/flixel/5,8,0" ]; then
            echo ""
            echo "ERRO: Flixel 5.8.0 não encontrado."
            exit 1
          fi

          echo ""
          echo "Flixel 5.8.0 instalado corretamente."


      # ==========================================
      # HXVLC 1.5.4
      # ==========================================

      - name: Install hxvlc 1.5.4
        run: |
          haxelib install hxvlc 1.5.4 --quiet

          echo ""
          echo "HXVLC:"
          haxelib path hxvlc


      # ==========================================
      # LIME 8.3.2
      # ==========================================

      - name: Install Lime 8.3.2
        run: |
          haxelib remove lime || true

          haxelib install lime 8.3.2 --quiet

          echo ""
          echo "LIME:"
          haxelib path lime


      # ==========================================
      # OPENFL
      # ==========================================

      - name: Install OpenFL
        run: |
          haxelib install openfl --quiet

          echo ""
          echo "OPENFL:"
          haxelib path openfl


      # ==========================================
      # HXCPP
      #
      # Usa a versão atual do repositório oficial.
      # A série 4.3 possui suporte a NDKs > 21.
      # ==========================================

      - name: Install hxcpp
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALANDO HXCPP"
          echo "======================================"

          rm -rf /tmp/hxcpp

          git clone --depth 1 \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          haxelib dev hxcpp /tmp/hxcpp

          echo ""
          echo "HXCPP:"
          haxelib path hxcpp


      # ==========================================
      # LIME SETUP
      # ==========================================

      - name: Setup Lime
        run: |
          haxelib run lime setup


      # ==========================================
      # CORRIGIR FLIXEL 5.8.0
      # ==========================================

      - name: Fix Flixel Android Manifest
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CORRIGINDO FLIXEL ANDROID"
          echo "======================================"

          FLIXEL_PATH="$GITHUB_WORKSPACE/.haxelib/flixel/5,8,0"

          echo ""
          echo "Flixel:"
          echo "$FLIXEL_PATH"

          if [ ! -f "$FLIXEL_PATH/include.xml" ]; then
            echo ""
            echo "ERRO: include.xml não encontrado."
            exit 1
          fi

          echo ""
          echo "Antes da correção:"

          grep -n -C 3 \
            "&ge;\|lime >=\|allowBackup\|appCategory" \
            "$FLIXEL_PATH/include.xml" || true

          # Remove a condição problemática que
          # poderia gerar if="lime &ge; 8.2.0"
          # no AndroidManifest.xml.

          sed -i 's/ if="lime &ge; 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          sed -i 's/ if="lime >= 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          echo ""
          echo "Depois da correção:"

          grep -n -C 3 \
            "&ge;\|lime >=\|allowBackup\|appCategory" \
            "$FLIXEL_PATH/include.xml" || true

          echo ""
          echo "Flixel corrigido."


      # ==========================================
      # LIME ANDROID
      # ==========================================

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android


      # ==========================================
      # VERIFICAR FLIXEL
      # ==========================================

      - name: Verify Flixel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFICANDO FLIXEL"
          echo "======================================"

          echo ""
          echo "Pasta:"
          ls -la .haxelib/flixel

          echo ""
          echo "Versão:"
          haxelib path flixel

          if [ ! -d ".haxelib/flixel/5,8,0" ]; then
            echo ""
            echo "ERRO: Flixel 5.8.0 não está ativo."
            exit 1
          fi

          echo ""
          echo "OK: Flixel 5.8.0."


      # ==========================================
      # VERIFICAR BIBLIOTECAS
      # ==========================================

      - name: Show versions
        run: |
          echo "======================================"
          echo "VERSÕES"
          echo "======================================"

          echo ""
          echo "Haxe:"
          haxe --version

          echo ""
          echo "Flixel:"
          haxelib path flixel

          echo ""
          echo "hxvlc:"
          haxelib path hxvlc

          echo ""
          echo "Lime:"
          haxelib path lime

          echo ""
          echo "OpenFL:"
          haxelib path openfl

          echo ""
          echo "hxcpp:"
          haxelib path hxcpp


      # ==========================================
      # LIMPAR BUILD
      # ==========================================

      - name: Clean Android export
        run: |
          rm -rf export/release/android
          rm -rf export/debug/android


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "COMPILANDO TWIDDLEFINGER"
          echo "======================================"

          haxelib run lime build android -release


      # ==========================================
      # PROCURAR APK
      # ==========================================

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "APKs ENCONTRADOS"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print


      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
          compression-level: 0
