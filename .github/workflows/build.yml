name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            clang \
            libc++-dev \
            libc++abi-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Lime
        run: |
          haxelib remove lime || true
          haxelib install lime
          echo "========== LIME =========="
          haxelib list | grep lime || true
          haxelib path lime

      - name: Install OpenFL
        run: |
          haxelib remove openfl || true
          haxelib install openfl
          haxelib path openfl

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install project dependencies
        run: |
          haxelib run hmm install

      - name: Fix hxcpp
        run: |
          haxelib remove hxcpp || true
          haxelib install hxcpp
          echo "========== HXCPP =========="
          haxelib list | grep hxcpp || true
          haxelib path hxcpp

      - name: Force Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Install hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Rebuild Lime native library
        run: |
          echo "========== REBUILD LIME =========="
          haxelib run lime rebuild cpp

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Check Lime NDLL
        run: |
          echo "========== LIME NDLL =========="
          find ~/.haxelib -name "lime.ndll" -print || true
          find .haxelib -name "lime.ndll" -print || true

      - name: Check environment
        run: |
          echo "========== HAXE =========="
          haxe --version

          echo "========== HAXELIB =========="
          haxelib list

          echo "========== LIME =========="
          haxelib path lime

          echo "========== HXCPP =========="
          haxelib path hxcpp

          echo "========== NDK =========="
          cat "$ANDROID_NDK_HOME/source.properties"

          echo "========== CLANG =========="
          clang++ --version

      - name: Clean build
        run: |
          rm -rf export
          rm -rf build

      - name: Build Android APK
        run: |
          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Find APK
       
