name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Android
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install Dependencies
        run: |
          haxelib run hmm install

      - name: Reinstall Lime
        run: |
          haxelib remove lime || true
          haxelib install lime

      - name: Reinstall OpenFL
        run: |
          haxelib remove openfl || true
          haxelib install openfl

      - name: Install hxcpp 4.3.45
        run: |
          wget -O /tmp/hxcpp.zip https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.45/hxcpp-4.3.45.zip
          haxelib install /tmp/hxcpp.zip --quiet
          haxelib set hxcpp 4.3.45

      - name: Install Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Install hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Verify Environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== HAXE ====="
          haxe --version

          echo "===== ANDROID SDK ====="
          echo "$ANDROID_SDK_ROOT"

          echo "===== ANDROID NDK ====="
          echo "$ANDROID_NDK_HOME"

          echo "===== HXCPP ====="
          haxelib path hxcpp

          echo "===== LIME ====="
          haxelib path lime

      - name: Setup Lime Android
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          haxelib run lime setup
          haxelib run lime setup android

      - name: Configure Lime Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"

      - name: Clean
        run: |
          rm -rf export
          rm -rf build

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          echo "===== BUILDING ====="

          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Inspect Manifest
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== PROCURANDO MANIFEST ====="

          find export -name "AndroidManifest.xml" -print 2>/dev/null || true

          MANIFEST="export/release/android/bin/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            echo ""
            echo "===== MANIFEST ====="
            cat "$MANIFEST"

            echo ""
            echo "===== MANIFEST COM LINHAS ====="
            nl -ba "$MANIFEST"

            echo ""
            echo "===== VALIDACAO XML ====="

            python3 -c 'import sys,xml.etree.ElementTree as ET; f=sys.argv[1]; print("Arquivo:",f); ET.parse(f); print("XML VALIDO")' "$MANIFEST" || true

          else
            echo "MANIFEST NAO ENCONTRADO"
          fi

      - name: Inspect Android Files
        if: steps.build.outcome == 'failure'
        run: |
          echo "===== ARQUIVOS ANDROID ====="

          if [ -d "export/release/android" ]; then
            find export/release/android -maxdepth 6 -type f -print | head -500
          else
            echo "Pasta Android nao encontrada."
          fi

      - name: Find APK
        if: always()
        run: |
          echo "===== APK ====="
          find . -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload Diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-Diagnostics
          path: |
            export/release/android/**/*.xml
            export/release/android/**/*.txt
            export/release/android/**/*.log
          if-no-files-found: ignore

      - name: Stop If Failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "BUILD FALHOU"
          exit 1

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
