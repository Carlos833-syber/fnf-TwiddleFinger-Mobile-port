name: Build TwiddleFinger Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;25.2.9519653"

      - name: Configurar Android
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Configurar Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Instalar HMM
        run: |
          haxelib install hmm
          haxelib run hmm install

      - name: Forçar Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          rm -rf .haxelib/flixel
          haxelib install flixel 5.8.0

          test -d ".haxelib/flixel/5,8,0"

      - name: Instalar HXVLС
        run: |
          haxelib install hxvlc 1.5.4

      - name: Instalar Lime
        run: |
          haxelib install lime 8.3.2

      - name: Instalar OpenFL
        run: |
          haxelib install openfl

      - name: Instalar HXCPP atualizado
        run: |
          rm -rf /tmp/hxcpp

          git clone --depth 1 \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          cd /tmp/hxcpp/tools/hxcpp

          haxe compile.hxml

          cd "$GITHUB_WORKSPACE"

          haxelib dev hxcpp /tmp/hxcpp

      - name: Configurar Lime
        run: |
          haxelib run lime setup

      - name: Corrigir Flixel AndroidManifest
        run: |
          FLIXEL=""

          if [ -f ".haxelib/flixel/5,8,0/include.xml" ]; then
            FLIXEL=".haxelib/flixel/5,8,0/include.xml"
          fi

          if [ -z "$FLIXEL" ]; then
            echo "Flixel 5.8.0 não encontrado"
            find .haxelib -maxdepth 3 -name include.xml -print
            exit 1
          fi

          echo "Flixel encontrado em:"
          echo "$FLIXEL"

          # Remove a condição problemática do Lime 8.2+
          sed -i 's/if="lime &ge; 8\.2\.0"//g' "$FLIXEL"
          sed -i 's/if="lime >= 8\.2\.0"//g' "$FLIXEL"

          # Remove possíveis variantes escapadas
          sed -i 's/if="lime &amp;ge; 8\.2\.0"//g' "$FLIXEL"

          echo "Verificando include.xml:"
          grep -n "allowBackup\|appCategory\|lime" "$FLIXEL" || true

      - name: Configurar Android Lime
        run: |
          haxelib run lime setup android

      - name: Limpar build anterior
        run: |
          rm -rf export
          rm -rf .lime

      - name: Verificar bibliotecas
        run: |
          echo "=============================="
          echo "FLIXEL"
          echo "=============================="
          haxelib path flixel

          echo "=============================="
          echo "LIME"
          echo "=============================="
          haxelib path lime

          echo "=============================="
          echo "OPENFL"
          echo "=============================="
          haxelib path openfl

          echo "=============================="
          echo "HXCPP"
          echo "=============================="
          haxelib path hxcpp

      - name: Compilar Android
        run: |
          set -e

          echo "======================================"
          echo "COMPILANDO TWIDDLEFINGER"
          echo "======================================"

          haxelib run lime build android -release

      - name: Procurar APK
        run: |
          echo "Arquivos Android gerados:"
          find export -type f \( \
            -name "*.apk" \
            -o -name "*.aab" \
          \) -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
