name: Build TwiddleFinger Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;25.2.9519653"

      - name: Android environment
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install HMM
        run: |
          haxelib install hmm
          haxelib run hmm install

      - name: Force Flixel 5.8.0
        run: |
          echo "======================================"
          echo "INSTALANDO FLIXEL 5.8.0"
          echo "======================================"

          haxelib remove flixel || true
          rm -rf .haxelib/flixel

          haxelib install flixel 5.8.0

          if [ ! -d ".haxelib/flixel/5,8,0" ]; then
            echo "ERRO: Flixel 5.8.0 não foi instalado."
            find .haxelib -maxdepth 4 -type d -name "flixel" -print
            exit 1
          fi

          echo "Flixel 5.8.0 OK."

      - name: Install HXVLС
        run: |
          echo "Instalando hxvlc 1.5.4..."
          haxelib install hxvlc 1.5.4

      - name: Install Lime
        run: |
          echo "Instalando Lime 8.3.2..."
          haxelib install lime 8.3.2

      - name: Install OpenFL
        run: |
          echo "Instalando OpenFL..."
          haxelib install openfl

      - name: Install HXCPP
        run: |
          echo "======================================"
          echo "INSTALANDO HXCPP"
          echo "======================================"

          rm -rf /tmp/hxcpp

          git clone --depth 1 \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          cd /tmp/hxcpp/tools/hxcpp

          echo "Compilando ferramenta hxcpp..."

          haxe compile.hxml

          cd "$GITHUB_WORKSPACE"

          haxelib dev hxcpp /tmp/hxcpp

          echo "HXCPP instalado."

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Patch Flixel XML
        run: |
          set -e

          echo "======================================"
          echo "CORRIGINDO XML DO FLIXEL"
          echo "======================================"

          FLIXEL_DIR=".haxelib/flixel/5,8,0"

          if [ ! -d "$FLIXEL_DIR" ]; then
            echo "Flixel não encontrado:"
            find .haxelib -maxdepth 4 -type d -print
            exit 1
          fi

          echo "Diretório:"
          echo "$FLIXEL_DIR"

          echo ""
          echo "Procurando &ge;..."

          FOUND=0

          while IFS= read -r -d '' FILE
          do
            if grep -q '&ge;\|&amp;ge;' "$FILE"; then

              FOUND=1

              echo "Corrigindo:"
              echo "$FILE"

              sed -i 's/&amp;ge;/>=/g' "$FILE"
              sed -i 's/&ge;/>=/g' "$FILE"

            fi
          done < <(
            find "$FLIXEL_DIR" \
              -type f \
              \( -name "*.xml" -o -name "*.hxml" \) \
              -print0
          )

          echo ""

          if [ "$FOUND" -eq 0 ]; then
            echo "Nenhum &ge; encontrado."
          else
            echo "&ge; corrigido."
          fi

          echo ""
          echo "Verificação final:"

          grep -Rni \
            '&ge;\|&amp;ge;' \
            "$FLIXEL_DIR" \
            || true

      - name: Patch Project.xml
        run: |
          set -e

          echo "======================================"
          echo "VERIFICANDO PROJECT.XML"
          echo "======================================"

          if [ -f "Project.xml" ]; then

            echo "Project.xml encontrado."

            sed -i 's/&amp;ge;/>=/g' Project.xml
            sed -i 's/&ge;/>=/g' Project.xml

            echo ""
            echo "Project.xml:"
            cat Project.xml

          else

            echo "ERRO: Project.xml não encontrado."
            exit 1

          fi

      - name: Setup Android Lime
        run: |
          echo "======================================"
          echo "SETUP ANDROID LIME"
          echo "======================================"

          haxelib run lime setup android

      - name: Clean build
        run: |
          echo "======================================"
          echo "LIMPANDO BUILD"
          echo "======================================"

          rm -rf export
          rm -rf .lime

      - name: Check libraries
        run: |
          echo "======================================"
          echo "BIBLIOTECAS"
          echo "======================================"

          echo ""
          echo "FLIXEL:"
          haxelib path flixel

          echo ""
          echo "LIME:"
          haxelib path lime

          echo ""
          echo "OPENFL:"
          haxelib path openfl

          echo ""
          echo "HXCPP:"
          haxelib path hxcpp

          echo ""
          echo "HXVLC:"
          haxelib path hxvlc

      - name: Check Android environment
        run: |
          echo "======================================"
          echo "ANDROID ENVIRONMENT"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Haxe:"
          haxe --version

          echo ""
          echo "Lime:"
          haxelib run lime version

      - name: Build Android
        run: |
          set +e

          echo ""
          echo "======================================"
          echo "COMPILANDO TWIDDLEFINGER"
          echo "======================================"
          echo ""

          haxelib run lime build android -release

          STATUS=$?

          echo ""
          echo "======================================"
          echo "STATUS DO BUILD"
          echo "======================================"

          echo "$STATUS"

          echo ""
          echo "======================================"
          echo "ARQUIVOS ANDROID"
          echo "======================================"

          if [ -d "export" ]; then
            find export -type f \
              \( \
                -name "*.apk" \
                -o -name "*.aab" \
                -o -name "AndroidManifest.xml" \
              \) \
              -print
          else
            echo "Pasta export não encontrada."
          fi

          echo ""
          echo "======================================"
          echo "MANIFESTS GERADOS"
          echo "======================================"

          find export \
            -name "AndroidManifest.xml" \
            -print 2>/dev/null \
            || true

          exit $STATUS

      - name: Show APK
        if: success()
        run: |
          echo "======================================"
          echo "APK GERADO"
          echo "======================================"

          find export -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
