name: Build TwiddleFinger Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;25.2.9519653"

      - name: Android variables
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install HMM
        run: |
          haxelib install hmm
          haxelib run hmm install

      - name: Force Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          rm -rf .haxelib/flixel
          haxelib install flixel 5.8.0
          test -d ".haxelib/flixel/5,8,0"

      - name: Install HXVLС
        run: |
          haxelib install hxvlc 1.5.4

      - name: Install Lime
        run: |
          haxelib install lime 8.3.2

      - name: Install OpenFL
        run: |
          haxelib install openfl

      - name: Install HXCPP
        run: |
          rm -rf /tmp/hxcpp

          git clone --depth 1 \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          cd /tmp/hxcpp/tools/hxcpp

          haxe compile.hxml

          cd "$GITHUB_WORKSPACE"

          haxelib dev hxcpp /tmp/hxcpp

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Fix Flixel Android
        run: |
          FLIXEL=".haxelib/flixel/5,8,0/include.xml"

          if [ ! -f "$FLIXEL" ]; then
            echo "Flixel include.xml not found"
            exit 1
          fi

          sed -i 's/if="lime &ge; 8\.2\.0"//g' "$FLIXEL"
          sed -i 's/if="lime >= 8\.2\.0"//g' "$FLIXEL"
          sed -i 's/if="lime &amp;ge; 8\.2\.0"//g' "$FLIXEL"

          echo "Flixel include.xml:"
          cat "$FLIXEL"

      - name: Setup Android Lime
        run: |
          haxelib run lime setup android

      - name: Clean
        run: |
          rm -rf export
          rm -rf .lime

      - name: Check libraries
        run: |
          echo "FLIXEL:"
          haxelib path flixel

          echo "LIME:"
          haxelib path lime

          echo "OPENFL:"
          haxelib path openfl

          echo "HXCPP:"
          haxelib path hxcpp

          echo "HXVLC:"
          haxelib path hxvlc

      - name: Build Android
        run: |
          set +e

          echo "======================================"
          echo "COMPILANDO TWIDDLEFINGER"
          echo "======================================"

          haxelib run lime build android -release

          STATUS=$?

          echo "======================================"
          echo "BUILD STATUS: $STATUS"
          echo "======================================"

          if [ -f "export/release/android/bin/app/src/main/AndroidManifest.xml" ]; then
            echo "======================================"
            echo "ANDROID MANIFEST"
            echo "======================================"

            nl -ba export/release/android/bin/app/src/main/AndroidManifest.xml

            echo "======================================"
            echo "CHECKING MANIFEST"
            echo "======================================"

            python3 -c "import xml.etree.ElementTree as ET; ET.parse('export/release/android/bin/app/src/main/AndroidManifest.xml'); print('MANIFEST XML OK')" || true
          else
            echo "AndroidManifest.xml not found"
          fi

          exit $STATUS

      - name: Find APK
        if: success()
        run: |
          echo "Generated files:"
          find export -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
