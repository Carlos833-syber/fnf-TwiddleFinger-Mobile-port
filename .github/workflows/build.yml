name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # ==========================================
      # Código do projeto
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Java
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # Haxe
      # ==========================================
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      # ==========================================
      # Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      # ==========================================
      # Android NDK
      # ==========================================
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      # ==========================================
      # Haxelib
      # ==========================================
      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      # ==========================================
      # HMM
      # ==========================================
      - name: Install HMM
        run: |
          haxelib install hmm
          haxelib run hmm install

      # ==========================================
      # Flixel 5.8.0
      # ==========================================
      - name: Install Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0

      # ==========================================
      # hxvlc 1.5.4
      # ==========================================
      - name: Install hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4

      # ==========================================
      # Lime
      # ==========================================
      - name: Install Lime
        run: |
          haxelib install lime
          haxelib run lime setup

      # ==========================================
      # OpenFL
      # ==========================================
      - name: Install OpenFL
        run: |
          haxelib install openfl
          haxelib run openfl setup

      # ==========================================
      # Verificar bibliotecas
      # ==========================================
      - name: Check Haxelib
        run: |
          echo "================================"
          echo "HAXE"
          haxe --version

          echo "================================"
          echo "HAXELIB"
          haxelib list

          echo "================================"
          echo "FLIXEL"
          haxelib list flixel

          echo "================================"
          echo "HXVLC"
          haxelib list hxvlc

      # ==========================================
      # Variáveis Android
      # ==========================================
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          if [ -n "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          fi

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # ==========================================
      # Configuração Lime
      # ==========================================
      - name: Configure Lime Android
        run: |
          haxelib run lime setup android

      # ==========================================
      # Limpar builds anteriores
      # ==========================================
      - name: Clean build
        run: |
          rm -rf export
          rm -rf build
          rm -rf .haxelib

      # ==========================================
      # Compilar APK
      # ==========================================
      - name: Build Android APK
        run: |
          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      # ==========================================
      # Procurar APK
      # ==========================================
      - name: Find APK
        run: |
          echo "================================"
          echo "APKs encontrados:"
          echo "================================"

          find . -type f -name "*.apk" -print

      # ==========================================
      # Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
