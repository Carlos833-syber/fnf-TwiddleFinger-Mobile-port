name: Build TwiddleFinger Android

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install HMM
        run: |
          haxelib install hmm --quiet

      - name: Install project dependencies
        run: |
          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi

      - name: Install Flixel 5.8.0
        run: |
          haxelib install flixel 5.8.0 --quiet

      - name: Install hxvlc 1.5.4
        run: |
          haxelib install hxvlc 1.5.4 --quiet

      - name: Install Lime 8.3.2
        run: |
          haxelib remove lime || true
          haxelib install lime 8.3.2 --quiet

      - name: Install OpenFL
        run: |
          haxelib install openfl --quiet

      - name: Install hxcpp 4.3.45
        shell: bash
        run: |
          rm -rf /tmp/hxcpp

          git clone --depth 1 \
            https://github.com/HaxeFoundation/hxcpp.git \
            /tmp/hxcpp

          cd /tmp/hxcpp

          git fetch --tags --depth 1 || true

          git checkout 4.3.45 2>/dev/null || true

          cd "$GITHUB_WORKSPACE"

          haxelib dev hxcpp /tmp/hxcpp

          echo "========== HXCPP =========="
          haxelib path hxcpp

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Fix Flixel Android Manifest
        shell: bash
        run: |
          set -e

          echo "========== Procurando Flixel =========="

          FLIXEL_PATH="$(haxelib path flixel | grep -E '/flixel/5,8,0($|/)' | head -n 1 || true)"

          if [ -z "$FLIXEL_PATH" ]; then
            FLIXEL_PATH="$(haxelib path flixel | head -n 1)"
          fi

          echo "Flixel:"
          echo "$FLIXEL_PATH"

          if [ ! -f "$FLIXEL_PATH/include.xml" ]; then
            echo "ERRO: include.xml do Flixel não encontrado."
            exit 1
          fi

          echo "========== Corrigindo include.xml =========="

          sed -i 's/ if="lime &ge; 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          sed -i 's/ if="lime >= 8\.2\.0"//g' \
            "$FLIXEL_PATH/include.xml"

          echo "Correção concluída."

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Check libraries
        run: |
          echo "========== HAXE =========="
          haxe --version

          echo "========== HAXELIB =========="
          haxelib list

          echo "========== HXVLС =========="
          haxelib path hxvlc

          echo "========== FLIXEL =========="
          haxelib path flixel

          echo "========== LIME =========="
          haxelib path lime

          echo "========== HXCPP =========="
          haxelib path hxcpp

      - name: Clean Android export
        run: |
          rm -rf export/release/android
          rm -rf export/debug/android

      - name: Build Android APK
        run: |
          haxelib run lime build android -release

      - name: Find APK
        run: |
          echo "========== APKs =========="

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
          compression-level: 0
