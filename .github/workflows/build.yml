name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            clang \
            libc++-dev \
            libc++abi-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Lime
        run: |
          haxelib install lime
          haxelib set lime latest

      - name: Install OpenFL
        run: |
          haxelib install openfl
          haxelib set openfl latest

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install project libraries
        run: |
          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi

      - name: Force Flixel 5.8.0
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0
          haxelib set flixel 5.8.0

      - name: Force hxvlc 1.5.4
        run: |
          haxelib remove hxvlc || true
          haxelib install hxvlc 1.5.4
          haxelib set hxvlc 1.5.4

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup android

      - name: Configure C++ compiler
        run: |
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-DANDROID" >> "$GITHUB_ENV"

      - name: Verify C++ environment
        run: |
          echo "===== GCC ====="
          g++ --version

          echo "===== CLANG ====="
          clang++ --version

          echo "===== LIBC++ ====="
          ls -la /usr/include/c++/v1/typeinfo || true

          echo "===== NDK ====="
          echo "$ANDROID_NDK_HOME"
          cat "$ANDROID_NDK_HOME/source.properties"

          echo "===== NDK CLANG ====="
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

          echo "===== HXCPP ====="
          haxelib path hxcpp

      - name: Clean
        run: |
          rm -rf export
          rm -rf build

      - name: Build Android APK
        run: |
          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
