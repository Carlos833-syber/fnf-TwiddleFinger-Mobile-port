name: Build TwiddleFinger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Haxe 4.3.5
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.5"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Haxelib setup
        run: |
          haxelib setup ~/haxelib

      - name: Install project dependencies
        run: |
          haxelib install hmm
          haxelib run hmm install

      - name: Force required Flixel version
        run: |
          haxelib remove flixel || true
          haxelib install flixel 5.8.0

      - name: Install Lime
        run: |
          haxelib install lime
          haxelib run lime setup

      - name: Install OpenFL
        run: |
          haxelib install openfl
          haxelib run openfl setup

      - name: Verify Haxe libraries
        run: |
          echo "=== Haxelib list ==="
          haxelib list

          echo "=== Flixel ==="
          haxelib list flixel

      - name: Configure Android
        run: |
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

          if [ -n "$ANDROID_NDK_HOME" ]; then
            haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_HOME"
          fi

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Clean
        run: |
          rm -rf export
          rm -rf build

      - name: Build APK
        run: |
          haxelib run lime build android -release -D HXCPP_IGNORE_WARNINGS

      - name: Show generated APKs
        run: |
          echo "=== APKs ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwiddleFinger-Android-APK
          path: |
            export/**/*.apk
            export/**/**/*.apk
            export/**/**/**/*.apk
          if-no-files-found: error
